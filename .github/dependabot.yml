# G66 — avisos de vulnerabilidades nuevas en dependencias.
#
# Desde G97 (2026-09-16) el repo ya vive en GitHub (remoto privado
# https://github.com/angel011298/yaentre), así que este archivo por fin puede
# hacer algo. No declara ninguna rama a propósito: Dependabot trabaja siempre
# contra la rama POR DEFECTO del repositorio, que aquí es `master`, así que no
# necesitó la corrección que sí requirió `.github/workflows/security-audit.yml`.
# FALTA UN PASO MANUAL: activar Dependabot en Settings → Code security →
# Dependabot alerts + Dependabot security updates. Hasta que Ángel lo haga,
# este archivo sigue sin abrir un solo PR. Una vez activo, abre un PR
# automático cada vez que salga un parche para una vulnerabilidad ya publicada
# — sin esperar a que alguien corra `pnpm audit` a mano.
#
# `open-pull-requests-limit: 0` para las actualizaciones de RUTINA (no
# ligadas a una vulnerabilidad): este proyecto fija versiones exactas a
# propósito (ver .npmrc `save-exact=true` y docs/AUDITORIA_SEGURIDAD.md §16)
# — cada bump merece revisión y su propia corrida de `pnpm test:unit`, no un
# PR semanal que nadie pida. Los avisos de SEGURIDAD (`security-updates`)
# no obedecen este límite: siempre se abren, es la razón de ser de este
# archivo.
version: 2
updates:
  - package-ecosystem: 'npm' # Dependabot detecta pnpm-lock.yaml automáticamente.
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
    labels:
      - 'dependencies'
      - 'security'
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
    labels:
      - 'dependencies'
      - 'ci'
