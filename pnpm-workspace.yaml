verifyDepsBeforeRun: false
# F22/G66: fuerza versiones parcheadas de dependencias TRANSITIVAS marcadas por
# `pnpm audit`. `sharp` en particular procesa imágenes subidas por usuarios
# reales (avatares vía next/image, F17/F20) — no es solo teórico, verificado
# con `pnpm build` tras el override que el pipeline de optimización de
# imágenes sigue compilando y funcionando.
#
# G66 — DOS bugs reales en este mismo mecanismo, encontrados auditándolo:
#
# 1. `fast-uri` y `dompurify` YA tenían un override desde F22 — y los dos
#    seguían resueltos a una versión VULNERABLE (`4.1.1` y `3.4.12`) porque el
#    rango `>=` de entonces (`>=3.1.4`, `>=3.4.12`) queda satisfecho por
#    CUALQUIER versión posterior, incluida una con un CVE nuevo publicado
#    después de F22. Un override con `>=` no es "parcheado para siempre": hay
#    que revisarlo cada vez que `pnpm audit` encuentre algo, no la primera.
#
# 2. MÁS GRAVE: un `>=` sin techo no solo permite un parche futuro — permite
#    CUALQUIER MAYOR futura. Comprobado en vivo al escribir los overrides
#    nuevos de esta fase: `nanoid: '>=3.3.18'` resolvió, sin avisar, a
#    `nanoid@6.0.1` — que es ESM-only y revienta a CUALQUIER consumidor que
#    lo pida con `require()` (webpack/postcss/Next.js internos). `undici:
#    '>=7.29.0'` saltó a `8.10.1` y `js-yaml: '>=4.3.1'` a `5.4.1`, ambos
#    mayores sin verificar. El propio override —pensado para proteger— se
#    había vuelto el vector de una actualización no revisada, justo lo que
#    esta fase debía evitar (ver docs/AUDITORIA_SEGURIDAD.md §16). Regla desde
#    ahora: TODO override de una dependencia transitiva va con techo de mayor
#    (`^`, o `>=x <y` explícito) — nunca un `>=` desnudo, ni siquiera para
#    `sharp`/`postcss` que llevaban así desde F22 sin haber saltado de mayor
#    todavía solo porque nadie había publicado una.
#
# `brace-expansion` tiene además DOS líneas mayores instaladas a la vez:
# `minimatch@3.1.5` (dentro de `eslint`) pide `^1.1.7`, y `minimatch@10.2.5`
# (dentro de `@typescript-eslint`) pide `^5.0.5` — el propio paquete publica
# ambas líneas en paralelo. Selector `padre@versión>hijo` (sintaxis oficial de
# pnpm) para no cruzarlas, CON techo de mayor en el valor — la falta de techo
# fue la causa real del cruce (ver punto 2), no el selector en sí.
overrides:
  fast-uri: '^4.1.4'
  dompurify: '^3.4.17'
  postcss: '^8.5.18'
  sharp: '^0.35.5'
  # G100: `brace-expansion` ya no son dos líneas sino TRES (la 2.x entró con
  # `readdir-glob`, dependencia de exceljs, G99), y los selectores por
  # `minimatch@x.y.z>` de G66 se quedaban cortos en cuanto cambiaba la versión
  # exacta del padre. Selector por RANGO del propio paquete: cada línea mayor
  # se fija a su parche sin cruzarse con las otras, y con techo de mayor.
  brace-expansion@^1: '^1.1.20'
  brace-expansion@^2: '^2.1.6'
  brace-expansion@^5: '^5.0.11'
  source-map-js: '^1.2.2'
  undici: '^7.30.1'
  js-yaml: '^4.3.1'
  nanoid: '^3.3.18'
  browserslist: '^4.28.7'
  # G71: dos avisos MODERADOS aparecidos después de G66. Quedan por debajo del
  # umbral de `pnpm security:deps` (`--audit-level=high`), así que la sonda
  # seguía en verde — se corrigen igual, con el mismo techo de mayor.
  #   · @xmldom/xmldom (vía mammoth, solo scripts offline de ingesta):
  #     inyección de fragmento XML, GHSA-6gmq-8vp8-gcm6, parcheado en 0.8.15.
  #   · fflate (vía posthog-js, sí llega al navegador): `unzipSync` puede
  #     entrar en bucle infinito con un ZIP64 malformado,
  #     GHSA-px8p-9vwx-vf98, parcheado en 0.4.9.
  '@xmldom/xmldom': '^0.8.15'
  fflate: '^0.4.9'
  # G99: `exceljs` (previsualización de .xlsx en la bóveda del admin)
  # arrastra `uuid@^8.3.0`, y el aviso GHSA-w5hq-g745-h8pq exige >=11.1.1
  # («missing buffer bounds check» cuando se pasa `buf`). Es MODERADO y
  # además no alcanzable por el uso que hace exceljs —llama a `v4()` sin
  # `buf`—, así que `pnpm security:deps` (--audit-level=high) no se
  # inmuta; se corrige igual, por el mismo criterio que los dos de G71.
  # Salto de 3 mayores, así que se verificó POR EFECTO que exceljs sigue
  # leyendo un .xlsx real (tests/admin/xlsx-preview.test.ts), no solo que
  # instala. Techo de mayor, como TODO override de este archivo (G66).
  uuid: '^11.1.1'
  # G103: avisos publicados después de la línea base (ninguno lo introdujo
  # G103). `vite` llega por @vitejs/plugin-react/vitest (solo desarrollo):
  # GHSA de launch-editor, parcheado en 8.1.6. EXACTO y no `^`: el override
  # también reescribe la dependencia directa de package.json, y con `^` saltó
  # a una 8.3.5 publicada tres días antes. dompurify (vía posthog-js, sí llega
  # al navegador) y undici (vía jsdom, pruebas) suben su piso arriba.
  vite: '8.1.6'
  # zod llega además por eslint-plugin-react-hooks (solo lint): GHSA de
  # agotamiento de memoria con colecciones grandes, parcheado en 4.6.6.
  zod: '^4.6.6'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  core-js: false
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
